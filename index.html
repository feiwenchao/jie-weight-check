<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发侧教程</title>
    
    <!-- 1. 加载器，放在 head 里，每个页面引入一次即可 -->
    <script src="https://img.js.design/assets/Resources/xframe/latest/jsframe.js"></script>
</head>
<body>
    <!-- 你可以放一些其他的标题或内容 -->
    <h1>我的网页</h1>

    <div class="box">
        <!-- 2. 网页组件代码，放在 body 里，你想展示的地方 -->
        <!-- ⚠️注意：这里的 src 必须是完整的 https 链接，不能是 /backend/ 这种本地路径 -->
        <js-frame src="https://js.design/elements/js_5DiceXlQosH"></js-frame> 
        <!-- 注意：把上面 src 里的链接换成你自己在截图里复制的那串！ -->
    </div>

</body>
</html>
