<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超级赛车竞速</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background-color: rgba(255, 255, 255, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding-top: 15vh;
            font-size: 28px;
            font-weight: 900;
            color: #000;
            letter-spacing: 2px;
        }

        .car-image-box {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle, rgba(220,220,220,1) 0%, rgba(255,255,255,1) 70%);
        }

        .car-image-box img {
            width: 100%;
            max-width: 380px;
            object-fit: contain;
            opacity: 0;
            transform: translateY(20px);
        }

        .started .car-image-box img {
            animation: slideUp 1s ease-out forwards;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            padding: 0 30px 10vh 30px;
        }

        .enter-text {
            font-size: 18px;
            font-weight: bold;
            color: #000;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-text {
            font-size: 14px;
            color: #666;
            font-weight: normal;
        }

        .progress-bar-bg {
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #70e0e0;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .start-text {
            color: #70e0e0;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }

        @media (max-width: 450px) {
            .mobile-container { height: 100vh; max-height: 100vh; }
        }
    </style>
</head>
<body>

    <div class="mobile-container" id="appContainer">
        
        <div class="start-overlay" id="startOverlay">
            <div class="start-text">点击启动引擎</div>
        </div>

        <div class="header">超级赛车竞速</div>

        <div class="car-image-box">
            <!-- ⚠️ 这里已经换成了你 GitHub 图床的直链 -->
            <img src="https://raw.githubusercontent.com/feiwenchao/jie-weight-check/33d763d4d1ec24c14f2eff8d696c295236c5f312/image.png.png" alt="超级赛车">
        </div>

        <div class="footer">
            <div class="enter-text">
                <span id="loadingText">等待启动...</span>
                <span class="progress-text" id="progressText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const loadingText = document.getElementById('loadingText');
        const startOverlay = document.getElementById('startOverlay');
        const appContainer = document.getElementById('appContainer');

        let progress = 0;
        const totalTime = 4000;
        const intervalTime = 50;
        const step = 100 / (totalTime / intervalTime);

        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        startOverlay.addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            appContainer.classList.add('started');
            loadingText.innerText = "正在进入赛道";

            playEngineSound();
            startLoading();
        });

        function playEngineSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(50, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 3.5);

            gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 1);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
        }

        function startLoading() {
            const timer = setInterval(() => {
                let randomStep = step * (0.5 + Math.random());
                progress += randomStep;

                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    
                    if (gainNode && audioCtx) {
                        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                        setTimeout(() => { oscillator.stop(); audioCtx.close(); }, 200);
                    }

                    setTimeout(() => {
                        loadingText.innerText = "加载完成";
                        loadingText.style.color = "#70e0e0";
                        window.location.href = "menu.html"; 
                    }, 300);
                }

                progressBar.style.width = `${progress}%`;
                progressText.innerText = `${Math.floor(progress)}%`;
            }, intervalTime);
        }
    </script>
</body>
</html>
